name: build, publish, test Docker images
on:
  push:
    branches:
      - main
      - nedas-deployment-test
env:
  FRONTEND_IMAGE: nb05/cookie-frontend
  BACKEND_IMAGE: nb05/cookie-backend
jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  pull-and-test:
    needs: build-and-push
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull images
        run: |
          docker pull ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker pull ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Start stack
        run: docker compose up -d

      - name: Wait for backend
        run: |
          for i in {1..15}; do
            curl --fail http://localhost:9000/ && exit 0
            sleep 2
          done
          echo "Backend did not become healthy in time" >&2
          exit 1

      - name: Wait for frontend
        run: |
          for i in {1..15}; do
            curl --fail http://localhost:8080 && exit 0
            sleep 2
          done
          echo "Frontend did not become healthy in time" >&2
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down
